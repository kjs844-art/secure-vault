[workspace]
members = [
    "crates/vault-crypto",
    "crates/vault-local-core",
    "crates/vault-local-store-sqlite",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
blake3 = { version = "=1.8.5", default-features = false, features = ["pure"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
libc = "=0.2.189"
minicbor = { version = "=2.3.0", features = ["std"] }
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
proptest = "=1.11.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "load_extension"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tempfile = "=3.27.0"
trybuild = "=1.0.120"
winapi-util = "=0.1.11"
zeroize = { version = "=1.9.0", features = ["derive"] }
