[package]
name = "vault-client-wasm"
version = "0.0.1-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
synthetic-demo = ["dep:vault-crypto", "dep:vault-local-core"]

[dependencies]
vault-client-bridge = { path = "../vault-client-bridge" }
vault-crypto = { path = "../vault-crypto", optional = true }
vault-local-core = { path = "../vault-local-core", optional = true }
wasm-bindgen = "=0.2.128"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
